name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LeiAccounting-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 界面截图：渲染主要页面，缩小后以 base64 打印到日志里，方便远程查看排版
      - name: UI screenshots
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --tests 'com.lei.accounting.ui.ScreenshotTest' --stacktrace

      - name: Print screenshots
        if: always()
        continue-on-error: true
        run: |
          [ -d app/build/screenshots ] || { echo "no screenshots"; exit 0; }
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick >/dev/null
          cd app/build/screenshots
          for f in *.png; do
            convert "$f" -resize 400x -quality 72 "/tmp/${f%.png}.jpg"
            echo "===SHOT_BEGIN ${f%.png}==="
            base64 -w 0 "/tmp/${f%.png}.jpg" | fold -w 3000
            echo
            echo "===SHOT_END==="
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
